name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    name: Lint, Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      postgres:
        # Docker Hub image
        image: mongo:latest
        # Provide the password for postgres
        env:
          MONGODB_DATABASE: ignite
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [19.x]

    steps:
      - name: Check out code
        uses: actions/checkout@v2
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Setup yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Copy .env file
        working-directory: apps/api
        run: cp .env.example .env

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_URI: "mongodb://db_mongo/ignite"
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          STRIPE_ACCOUNT: ${{ secrets.STRIPE_ACCOUNT }}
