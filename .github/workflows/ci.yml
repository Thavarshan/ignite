name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Fullstack Application CI
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.2
        env:
          MYSQL_DATABASE: ignite_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ignite_test
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Verify MySQL service readiness
        run: |
          until mysqladmin ping \
            --host=127.0.0.1 \
            --port=${{ job.services.mysql.ports['3306'] }} \
            --user=root \
            --password=root \
            --silent; do
            sleep 1
          done

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --no-interaction --force

      - name: Audit PHP dependencies
        run: composer audit --no-interaction --format=table

      - name: Audit Node dependencies
        run: npm audit --audit-level=moderate

      - name: Cache configuration and routes
        run: |
          php artisan optimize

      - name: Lint PHP with Pint
        run: ./vendor/bin/pint --test

      - name: Lint source
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build client and SSR bundles
        run: npm run build:ssr

      - name: Run test suite
        run: php artisan test
