name: PHP Tests

on:
  push:
    branches:
      - main
      - development
      - feature/**
      - fix/**
      - refactor/**
  pull_request:
    types: [opened]
    branches:
      - main
      - development
      - feature/**
      - fix/**
      - refactor/**

jobs:
  tests:
    runs-on: ubuntu-latest

    # Service container Mysql
    services:
      # Label used to access the service container
      mysql:
        # Docker Hub image (also with version)
        image: mysql:latest
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE:  minerva_db
        ## map the "external" 33306 port with the "internal" 3306
        ports:
          - 33306:3306
        # Set health checks to wait until mysql database has started (it takes some seconds to start)
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['8.2']
        node-versions: ['20.x']
        dependency-stability: ['prefer-none']

    name: P${{ matrix.php-versions }} - N${{ matrix.node-versions }} - ${{ matrix.dependency-stability }} - ${{ matrix.operating-system}}

    steps:
    - uses: actions/checkout@v3

    - name: Install PHP versions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mailparse # Add mailparse extension

    - name: Get Composer Cache Directory 2
      id: composer-cache
      run: |
        echo "::set-output name=dir::$(composer config cache-files-dir)"

    - uses: actions/cache@v3
      id: actions-cache
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Cache PHP dependencies
      uses: actions/cache@v3
      id: vendor-cache
      with:
        path: vendor
        key: ${{ runner.OS }}-build-${{ hashFiles('**/composer.lock') }}

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      run: composer install -n --prefer-dist

    - name: Update Dependencies with latest stable
      if: matrix.dependency-stability == 'prefer-stable'
      run: composer update --prefer-stable

    - name: Update Dependencies with lowest stable
      if: matrix.dependency-stability == 'prefer-lowest'
      run: composer update --prefer-stable --prefer-lowest

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Migrations
      # Set environment
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: minerva_db
        DB_PORT: 33306
        DB_USER: root

      run: php artisan migrate

    - name: Show dir
      run: pwd

    - name: PHP Version
      run: php --version

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Cache node_modules directory
      uses: actions/cache@v3
      id: node_modules-cache
      with:
        path: node_modules
        key: ${{ runner.OS }}-build-${{ hashFiles('**/package.json') }}-${{ hashFiles('**/package-lock.json') }}

    - name: Install NPM packages
      if: steps.node_modules-cache.outputs.cache-hit != 'true'
      run: npm ci

    - name: Publish configs to frontend
      run: php artisan config:publish

    - name: Build frontend
      run: npm run build

    # Code quality
    - name: Execute tests (Unit and Feature tests) via PHPUnit
      # Set environment
      env:
        APP_MODE: 'api,cli,web'
        DB_CONNECTION: mysql
        DB_DATABASE: minerva_db
        DB_PORT: 33306
        DB_USER: root
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      run: php artisan test --parallel --processes=10

    - uses: symfonycorp/security-checker-action@v4
